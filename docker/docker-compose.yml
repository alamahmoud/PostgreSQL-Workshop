# Students MIS PostgreSQL Workshop — student environment
#
# BROWSER DELIVERY (recommended):
#     docker compose up -d --build
#     open http://localhost:8080
#   The portal shows every lab server; clicking "Open terminal" creates the
#   container on demand and attaches a terminal in the browser.
#
# CLI DELIVERY (no browser portal):
#     docker compose --profile lab1 up -d --build
#     docker compose --profile lab2 up -d --build
#     docker compose exec -u ubuntu <service> bash
#
# Reset a lab from the portal (Reset button) or:
#     docker compose --profile lab1 down   (or remove sm-* containers)
# State lives in the containers, not volumes — reset is always one step.

services:

  portal:
    build: ./portal
    image: studentsmis/pg-lab-portal:1.0
    container_name: sm-portal
    ports:
      - "8080:8080"
    environment:
      LAB_IMAGE: studentsmis/pg-lab:1.0
      LAB_NETWORK: studentsmis-labnet
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      # package root, read-only: the portal builds the lab image from it
      # on first start if the image is missing
      - ..:/workshop:ro
    init: true
    networks: [labnet]

  # ---- CLI profiles (same image the portal uses) -------------------------
  lab1:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    image: studentsmis/pg-lab:1.0
    container_name: sm-lab1
    hostname: lab1
    environment:
      LAB_ROLE: lab1
    ports:
      - "5432:5432"          # optional: reach it from host tools (psql, DBeaver)
    shm_size: 256mb
    init: true
    profiles: ["lab1"]
    networks: [labnet]

  pg-primary:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    image: studentsmis/pg-lab:1.0
    container_name: sm-pg-primary
    hostname: pg-primary
    environment:
      LAB_ROLE: lab2-primary
    ports:
      - "5433:5432"
    shm_size: 256mb
    init: true
    profiles: ["lab2"]
    networks:
      labnet:
        ipv4_address: 172.28.5.10

  pg-standby:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    image: studentsmis/pg-lab:1.0
    container_name: sm-pg-standby
    hostname: pg-standby
    environment:
      LAB_ROLE: lab2-standby
    ports:
      - "5434:5432"
    shm_size: 256mb
    init: true
    profiles: ["lab2"]
    networks:
      labnet:
        ipv4_address: 172.28.5.11

networks:
  labnet:
    name: studentsmis-labnet
    ipam:
      config:
        - subnet: 172.28.5.0/24
